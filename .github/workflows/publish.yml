name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # bundles npm >= 11.5.1, required for Trusted Publishing OIDC
          # No registry-url on purpose: it writes an _authToken line into .npmrc
          # which makes npm skip the OIDC handshake. The default registry is
          # npmjs.org, which is what Trusted Publishing authenticates against.
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --provenance
