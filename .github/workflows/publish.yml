name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # bundles npm >= 11.5.1, required for Trusted Publishing OIDC
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          # setup-node exports a placeholder NODE_AUTH_TOKEN that otherwise
          # shadows the OIDC handshake; clearing it forces Trusted Publishing.
          NODE_AUTH_TOKEN: ""
